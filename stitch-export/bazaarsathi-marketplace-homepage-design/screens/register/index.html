<body class="bg-background font-body-md text-on-background h-screen flex overflow-hidden">
<!-- Left Side: Illustration -->
<div class="hidden lg:flex lg:w-1/2 bg-surface-container-low flex-col items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 bg-primary/5 pattern-dots-md text-primary/10"></div>
<div class="z-10 w-full h-full p-2xl flex items-center justify-center">
<img alt="BazaarSathi Marketplace Illustration" class="w-full h-full object-contain drop-shadow-xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuANOlNxD0VvOyiowMVTimpvhohjLXPubyGdTC2BNVGWpey3Mq-Z8bbKaQHKZUpvDWp10u4xi7K7yocuxIcZGMnSNpUTFivpfWK8jzEyqiO3b6f2PVCl6rd0WV5YQwAnnu9bE7e-KbvEd0Ikwg1-YlLejP-Dukj90Chugi-QWAPTTlFUWmy5Jl93X2VKc4mym6P5iXwTLwaUsEI0n7EfeE-NpAWRhrtssmJlx7w2XlQ9uEfSBKdI1659Og"/>
</div>
</div>
<!-- Right Side: Registration Form -->
<div class="w-full lg:w-1/2 flex flex-col justify-center px-gutter sm:px-xl md:px-2xl bg-surface-container-lowest overflow-y-auto">
<div class="w-full max-w-[480px] mx-auto">
<!-- Logo -->
<div class="mb-xl flex justify-center lg:justify-start">
<img alt="BazaarSathi Logo" class="h-16 w-auto" src="https://lh3.googleusercontent.com/aida/AP1WRLubVnr-VpNqBCXv6QbbBLwiPHc3hpGSYITVtw86aNOQl-DuDQbdlP9524f94iQ04PVgBH6Ft127a-jN9ULrSEuDvluCeb4XjbmsqkNmYtw3yRXvApc8ACmNyMuvScLdJ2Q3B4bfrfI8m72cWtY9BKsodnBdCOh9ezNliRL1sXsFpthwzaXwFzhEPi_yYhwVxpefNFS7-k5z7vwQRs4f717X_59-BeFHgYG7Hk8rkC6CccF0rayUdbdedWc"/>
</div>
<!-- Header -->
<div class="mb-xl text-center lg:text-left">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-sm">Join our community</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Start buying and selling locally today</p>
</div>
<!-- Form -->
<form class="space-y-lg">
<!-- Full Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="fullName">Full Name</label>
<input class="w-full h-12 px-md rounded-lg border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all shadow-sm" id="fullName" name="fullName" placeholder="e.g. Ram Bahadur" required="" type="text"/>
</div>
<!-- Email -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email address</label>
<input class="w-full h-12 px-md rounded-lg border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all shadow-sm" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Password</label>
<input class="w-full h-12 px-md rounded-lg border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all shadow-sm" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="confirmPassword">Confirm Password</label>
<input class="w-full h-12 px-md rounded-lg border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all shadow-sm" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Actions -->
<div class="pt-sm space-y-md">
<button class="w-full h-12 bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:bg-primary/90 transition-colors shadow-md hover:shadow-lg flex items-center justify-center gap-sm" type="submit">
                        Create Account
                    </button>
<div class="relative flex items-center py-sm">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-md text-on-surface-variant font-label-sm text-label-sm uppercase tracking-wider">Or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<button class="w-full h-12 bg-surface-container-lowest text-on-surface border border-outline-variant font-label-md text-label-md rounded-lg hover:bg-surface-container-low transition-colors shadow-sm flex items-center justify-center gap-sm" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25C22.56 11.47 22.49 10.71 22.36 9.98H12V14.28H17.93C17.67 15.66 16.89 16.83 15.72 17.61V20.42H19.28C21.36 18.5 22.56 15.65 22.56 12.25Z" fill="#4285F4"></path>
<path d="M12 23C14.97 23 17.46 22.02 19.28 20.42L15.72 17.61C14.74 18.27 13.48 18.66 12 18.66C9.13 18.66 6.7 16.73 5.84 14.12H2.17V16.97C3.99 20.59 7.69 23 12 23Z" fill="#34A853"></path>
<path d="M5.84 14.12C5.62 13.46 5.49 12.75 5.49 12C5.49 11.25 5.62 10.54 5.84 9.88V7.03H2.17C1.43 8.52 1 10.21 1 12C1 13.79 1.43 15.48 2.17 16.97L5.84 14.12Z" fill="#FBBC05"></path>
<path d="M12 5.34C13.62 5.34 15.06 5.89 16.2 6.98L19.36 3.82C17.46 2.05 14.97 1 12 1C7.69 1 3.99 3.41 2.17 7.03L5.84 9.88C6.7 7.27 9.13 5.34 12 5.34Z" fill="#EA4335"></path>
</svg>
                        Continue with Google
                    </button>
</div>
</form>
<!-- Footer Link -->
<p class="mt-xl text-center font-body-md text-body-md text-on-surface-variant">
                Already have an account? <a class="text-primary font-label-md text-label-md hover:underline" href="#">Login</a>
</p>
</div>
</div>
</body></html>
